name: Digital Edge Lab — Generate pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/generate-pilot.yml"
      - "requirements.txt"
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate pilot video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.8-flash
          GEMINI_TTS_MODEL: gemini-2.5-flash-preview-tts
        run: python src/pipeline.py

      - name: Save narrator memory for the next episode
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp output/channel-memory.json memory/channel-memory.json
          if ! git diff --quiet -- memory/channel-memory.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add memory/channel-memory.json
            git commit -m "Update Digital Edge Lab narrator memory"
            git push
          fi

      - name: Upload pilot artifact
        if: always() && hashFiles('output/delivery/run-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-pilot
          path: output/delivery/
          retention-days: 7
