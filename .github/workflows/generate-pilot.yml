name: Digital Edge Lab — Generate pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate pilot video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          GEMINI_TTS_MODEL: gemini-2.5-flash-preview-tts
        run: python src/pipeline.py

      - name: Upload pilot artifact
        if: always() && hashFiles('output/run-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-pilot
          path: output/
          retention-days: 7
