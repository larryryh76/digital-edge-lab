name: Digital Edge Lab — Produce verified pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "generated = Gemini script + voice; offline = checked-in plan + local voice"
        type: choice
        default: generated
        options:
          - generated
          - offline
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "plans/**"
      - ".github/workflows/generate-pilot.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "plans/**"
      - ".github/workflows/generate-pilot.yml"
      - "requirements.txt"
  schedule:
    - cron: "0 10 * * *"

concurrency:
  # Only the newest run for a given workflow/ref should consume a runner.
  group: digital-edge-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  GEMINI_TEXT_MODEL: gemini-3.8-flash
  GEMINI_TTS_MODEL: gemini-3.8-flash-tts
  FFMPEG_STATIC_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
  FFMPEG_STATIC_SHA256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
  BLENDER_URL: https://download.blender.org/release/Blender4.2/blender-4.2.11-linux-x64.tar.xz
  DEL_RENDER_WORKERS: "2"
  DEL_RENDER_PHASE_BUDGET_SECONDS: "2700"

jobs:
  fast-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Fast Python tests (no Blender bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg required by narration tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Install Python dependencies
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run offline unit tests
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

  verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.head_ref == 'fix/renderer-action-context-mainline')
    name: Full renderer certification (manual or scheduled only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore cached FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: /opt/ffmpeg
          key: ffmpeg-7.0.2-static-amd64-v1

      - name: Install pinned FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # The distro ffmpeg package drags in a large dependency tree that has
          # repeatedly exceeded the install budget on slow runner mirrors, so the
          # build is pinned, checksum-verified and installed in one download.
          for attempt in 1 2 3; do
            if curl -sS --fail --connect-timeout 20 --max-time 300 \
                -o /tmp/ffmpeg.tar.xz "$FFMPEG_STATIC_URL"; then
              break
            fi
            echo "ffmpeg download attempt $attempt failed; retrying"
            sleep 5
          done
          echo "$FFMPEG_STATIC_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/ffmpeg
          sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
          sudo ln -sf /opt/ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /opt/ffmpeg/ffprobe /usr/local/bin/ffprobe
          rm -f /tmp/ffmpeg.tar.xz

      - name: Put pinned FFmpeg on PATH
        run: |
          set -euo pipefail
          sudo ln -sf /opt/ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /opt/ffmpeg/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      - name: Restore cached Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-4.2.11-linux-x64

      - name: Install pinned Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -sS --fail --connect-timeout 20 --max-time 420 \
                -o /tmp/blender.tar.xz "$BLENDER_URL"; then
              break
            fi
            echo "blender download attempt $attempt failed; retrying"
            sleep 5
          done
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          rm -f /tmp/blender.tar.xz
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender

      - name: Install local voice and fonts
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          timeout 240 sudo apt-get $APT update
          timeout 360 sudo apt-get $APT install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
            espeak-ng fonts-dejavu-core
          espeak-ng --version | head -1

      - name: Resolve Blender runtime libraries
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          # EEVEE needs a working OpenGL context even in --background mode. The
          # hosted image ships libGLX but no EGL loader or Mesa software driver,
          # and Blender dlopen()s libEGL so ldd cannot discover the gap.
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          timeout 420 sudo apt-get $APT install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgl1-mesa-dri libxkbcommon0 \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libsm6 libice6 libxext6 libgomp1 \
            libxrandr2 libxinerama1
          if ldd /opt/blender/blender | grep -q "not found"; then
            ldd /opt/blender/blender | grep "not found"
            echo "::error::Blender has unresolved shared libraries"
            exit 1
          fi
          blender --version | head -1
          # Fail here, with a clear message, if EEVEE cannot start its GPU backend.
          rm -f /tmp/gpucheck_0001.png
          LIBGL_ALWAYS_SOFTWARE=1 blender -b --factory-startup -E BLENDER_EEVEE_NEXT \
            -o /tmp/gpucheck_ -F PNG -f 1 | tail -5
          test -s /tmp/gpucheck_0001.png
          echo "EEVEE background render OK ($(stat -c%s /tmp/gpucheck_0001.png) byte probe frame)"

      - name: Verify render toolchain
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          command -v blender
          command -v espeak-ng
          ffmpeg -version | head -1
          blender --version | head -1

      - name: Install Python dependencies
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile and run offline unit tests
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

      - name: Renderer smoke test on real Blender output
        run: python tests/render_smoke.py

  pilot:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.head_ref == 'fix/renderer-action-context-mainline')
    permissions:
      contents: write
    name: Render and verify one complete pilot
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore cached FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: /opt/ffmpeg
          key: ffmpeg-7.0.2-static-amd64-v1

      - name: Install pinned FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -sS --fail --connect-timeout 20 --max-time 300 \
                -o /tmp/ffmpeg.tar.xz "$FFMPEG_STATIC_URL"; then
              break
            fi
            echo "ffmpeg download attempt $attempt failed; retrying"
            sleep 5
          done
          echo "$FFMPEG_STATIC_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/ffmpeg
          sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
          sudo ln -sf /opt/ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /opt/ffmpeg/ffprobe /usr/local/bin/ffprobe
          rm -f /tmp/ffmpeg.tar.xz

      - name: Put pinned FFmpeg on PATH
        run: |
          set -euo pipefail
          sudo ln -sf /opt/ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /opt/ffmpeg/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      - name: Restore cached Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-4.2.11-linux-x64

      - name: Install pinned Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -sS --fail --connect-timeout 20 --max-time 420 \
                -o /tmp/blender.tar.xz "$BLENDER_URL"; then
              break
            fi
            echo "blender download attempt $attempt failed; retrying"
            sleep 5
          done
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          rm -f /tmp/blender.tar.xz
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender

      - name: Install local voice and fonts
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          timeout 240 sudo apt-get $APT update
          timeout 360 sudo apt-get $APT install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
            espeak-ng fonts-dejavu-core
          espeak-ng --version | head -1

      - name: Resolve Blender runtime libraries
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          # EEVEE needs a working OpenGL context even in --background mode. The
          # hosted image ships libGLX but no EGL loader or Mesa software driver,
          # and Blender dlopen()s libEGL so ldd cannot discover the gap.
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          timeout 420 sudo apt-get $APT install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgl1-mesa-dri libxkbcommon0 \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libsm6 libice6 libxext6 libgomp1 \
            libxrandr2 libxinerama1
          if ldd /opt/blender/blender | grep -q "not found"; then
            ldd /opt/blender/blender | grep "not found"
            echo "::error::Blender has unresolved shared libraries"
            exit 1
          fi
          blender --version | head -1
          # Fail here, with a clear message, if EEVEE cannot start its GPU backend.
          rm -f /tmp/gpucheck_0001.png
          LIBGL_ALWAYS_SOFTWARE=1 blender -b --factory-startup -E BLENDER_EEVEE_NEXT \
            -o /tmp/gpucheck_ -F PNG -f 1 | tail -5
          test -s /tmp/gpucheck_0001.png
          echo "EEVEE background render OK ($(stat -c%s /tmp/gpucheck_0001.png) byte probe frame)"

      - name: Verify render toolchain
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          command -v blender
          command -v espeak-ng
          ffmpeg -version | head -1
          blender --version | head -1

      - name: Install Python dependencies
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Record run context
        if: always()
        run: |
          mkdir -p output/diagnostics
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "mode=${{ github.event.inputs.mode || 'generated' }}"
          } > output/diagnostics/run-context.txt

      - name: Resolve production mode
        id: mode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
        run: |
          requested="${REQUESTED_MODE:-}"
          if [ -z "$requested" ]; then
            # Pull-request and push builds verify the engine deterministically; the
            # generated path (Gemini script + hosted voice) runs on dispatch/nightly.
            case "${GITHUB_EVENT_NAME}" in
              workflow_dispatch|schedule) requested=generated ;;
              *) requested=offline ;;
            esac
          fi
          if [ "$requested" = "auto" ]; then
            if [ -n "${GEMINI_API_KEY:-}" ]; then requested=generated; else requested=offline; fi
          fi
          if [ "$requested" = "generated" ] && [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY is not configured. Add it in Settings → Secrets, or select mode=offline."
            exit 1
          fi
          echo "mode=$requested" >> "$GITHUB_OUTPUT"
          echo "Resolved production mode: $requested"

      - name: Produce pilot (Gemini script and narration)
        if: steps.mode.outputs.mode == 'generated'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/pipeline.py --fallback-plan plans/quantization-on-device.json

      - name: Produce pilot (deterministic offline plan, local voice)
        if: steps.mode.outputs.mode == 'offline'
        run: |
          python src/pipeline.py --offline --plan plans/quantization-on-device.json

      - name: Publish run summary
        if: always()
        run: python src/run_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Save narrator memory for the next episode
        if: success() && github.ref == 'refs/heads/main'
        run: |
          cp output/channel-memory.json memory/channel-memory.json
          if ! git diff --quiet -- memory/channel-memory.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add memory/channel-memory.json
            git commit -m "Update Digital Edge Lab narrator memory"
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload verified delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-pilot
          path: output/delivery/
          if-no-files-found: error
          retention-days: 14

      - name: Upload renderer review frames
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-scene-review
          path: output/delivery/scene-review/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-failure-${{ github.run_number }}
          path: |
            output/**
            !output/delivery/*.mp4
          if-no-files-found: warn
          retention-days: 14
