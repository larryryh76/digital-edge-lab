name: Digital Edge Lab — Generate pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/generate-pilot.yml"
      - "requirements.txt"
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: digital-edge-lab-pilot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender libegl1 libgl1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Initialize diagnostics
        if: always()
        run: |
          mkdir -p output/diagnostics
          { date -u +'%Y-%m-%dT%H:%M:%SZ'; echo "run_id=$GITHUB_RUN_ID"; echo "run_attempt=$GITHUB_RUN_ATTEMPT"; echo "commit=$GITHUB_SHA"; } > output/diagnostics/run-context.txt

      - name: Python syntax and offline tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

      - name: Blender smoke test
        run: python tests/blender_smoke.py

      - name: Generate pilot video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.8-flash
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
        run: python src/pipeline.py

      - name: Save narrator memory for the next episode
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp output/channel-memory.json memory/channel-memory.json
          if ! git diff --quiet -- memory/channel-memory.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add memory/channel-memory.json
            git commit -m "Update Digital Edge Lab narrator memory"
            git push
          fi

      - name: Upload successful delivery
        if: success() && hashFiles('output/delivery/run-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-pilot
          path: output/delivery/
          retention-days: 14

      - name: Preserve failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-failure-${{ github.run_number }}
          path: |
            output/diagnostics/**
            output/**
            !output/delivery/digital-edge-lab-pilot.mp4
          if-no-files-found: warn
          retention-days: 14
