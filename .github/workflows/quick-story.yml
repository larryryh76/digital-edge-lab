name: Digital Edge Lab — AI story and video
on:
  pull_request:
    paths:
      - '.github/workflows/quick-story.yml'
      - 'src/quick_story.py'
      - 'scripts/generate_video.py'
  workflow_dispatch:
    inputs:
      topic:
        description: "Manual run only; video generation uses paid API quota. Optional topic."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: digital-edge-lab-quick-story
  cancel-in-progress: false

jobs:
  validate-code:
    name: Validate Python syntax without spending API credits
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile Python scripts
        run: python -m py_compile src/quick_story.py scripts/generate_video.py

  generate-video:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-code
    name: Choose topic, write story, generate and validate MP4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: gemini-2.5-flash
      GEMINI_VIDEO_MODEL: gemini-omni-1.1-flash
      EPISODE_TOPIC: ${{ inputs.topic }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out channel memory
        uses: actions/checkout@v4
      - name: Generate detailed story prompt
        run: python src/quick_story.py
      - name: Generate actual vertical video with native audio
        run: python scripts/generate_video.py
      - name: Save prompt, MP4 and verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-episode-${{ github.run_number }}
          path: |
            output/story-prompt/*
            output/video/*
          if-no-files-found: warn
          retention-days: 14
