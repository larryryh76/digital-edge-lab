name: Character GLB animation import proof
on:
  pull_request:
    paths:
      - "scripts/blender_glb_animation_proof.py"
      - "scripts/fetch_animation_assets.py"
      - "scripts/subject_motion_qa.py"
      - "tests/test_subject_motion_qa.py"
      - ".github/workflows/character-glb-animation-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-and-render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
          python -m pip install --user numpy
          BLENDER_PY_VERSION=$(blender -b --python-expr "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" | tail -1)
          BLENDER_ABI=$(echo "$BLENDER_PY_VERSION" | tr -d '.')
          python -m pip install --only-binary=:all: --target /tmp/blender-python-deps \
            --platform manylinux_2_28_x86_64 --implementation cp --abi "cp$BLENDER_ABI" \
            --python-version "$BLENDER_PY_VERSION" "numpy>=2.2,<2.4"
          PYTHONPATH=/tmp/blender-python-deps blender -b --python-expr "import bpy, numpy; print('Blender GLB importer dependencies OK:', bpy.app.version_string, numpy.__version__)"
          blender --version | head -1
      - name: Test encoded subject-motion gate
        run: python -m unittest tests/test_subject_motion_qa.py -v
      - name: Download and verify CC0 UAL1 archive and GLB
        run: python scripts/fetch_animation_assets.py --pack ual1 --asset-dir assets/animations --cache-dir /tmp/animation-cache
      - name: Import rig and render animation proof
        timeout-minutes: 12
        run: |
          mkdir -p output
          PYTHONPATH=/tmp/blender-python-deps blender -b --python scripts/blender_glb_animation_proof.py -- assets/animations/UAL1_Standard.glb output/character-animation-proof.mp4
          test -s output/character-animation-proof.mp4
          test -s output/character-animation-proof.json
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json output/character-animation-proof.mp4
      - name: Reject static or background-only character footage
        run: python scripts/subject_motion_qa.py output/character-animation-proof.mp4 --report output/character-animation-proof.motion-qa.json
      - name: Upload actual animated character proof and QA
        uses: actions/upload-artifact@v4
        with:
          name: character-glb-animation-proof
          path: |
            output/character-animation-proof.mp4
            output/character-animation-proof.json
            output/character-animation-proof.motion-qa.json
          if-no-files-found: error
          retention-days: 7
