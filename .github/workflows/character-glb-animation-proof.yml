name: Character GLB animation import proof
on:
  pull_request:
    paths:
      - "scripts/blender_glb_animation_proof.py"
      - "scripts/fetch_animation_assets.py"
      - "scripts/subject_motion_qa.py"
      - "scripts/inspect_animation_glb.py"
      - "scripts/blender_animation_smoke.py"
      - "tests/test_subject_motion_qa.py"
      - "tests/test_inspect_animation_glb.py"
      - ".github/workflows/character-glb-animation-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  BLENDER_URL: https://download.blender.org/release/Blender4.2/blender-4.2.11-linux-x64.tar.xz
concurrency:
  group: del-character-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import-and-render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2 and runtime
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo apt-get install -y --no-install-recommends ffmpeg python3-numpy \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libsm6 libice6 libxext6 libgomp1 libxrandr2 libxinerama1
          curl -sS --fail --retry 3 --connect-timeout 20 --max-time 420 \
            -o /tmp/blender.tar.xz "$BLENDER_URL"
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          rm -f /tmp/blender.tar.xz
          blender -b --python-expr "import bpy, numpy; print('Blender runtime OK:', bpy.app.version_string, numpy.__version__)"
          blender --version | head -1
      - name: Test encoded subject-motion gate
        run: |
          python -m pip install --disable-pip-version-check "numpy>=2.2,<2.4"
          python -m unittest tests/test_subject_motion_qa.py tests/test_inspect_animation_glb.py -v
      - name: Download and verify both CC0 animation packs
        run: python scripts/fetch_animation_assets.py --pack both --asset-dir assets/animations --cache-dir /tmp/animation-cache
      - name: Inspect animation clips and humanoid rigs
        run: python scripts/inspect_animation_glb.py assets/animations/UAL1_Standard.glb assets/animations/UAL2_Standard.glb --min-animations 20 --min-joints 40
      - name: Render actual walk/jog motion review frames from both packs
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p output/animation-review
          blender -b -t 2 --python-exit-code 1 --python scripts/blender_animation_smoke.py -- assets/animations/UAL1_Standard.glb output/animation-review/UAL1
          blender -b -t 2 --python-exit-code 1 --python scripts/blender_animation_smoke.py -- assets/animations/UAL2_Standard.glb output/animation-review/UAL2
          test -s output/animation-review/UAL1/animation-smoke.json
          test -s output/animation-review/UAL2/animation-smoke.json
      - name: Import rig and render animation proof
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p output
          blender -b --python scripts/blender_glb_animation-proof.py -- assets/animations/UAL1_Standard.glb output/character-animation-proof.mp4
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -start_number 0 \\
            -i output/proof_frames/frame_%04d.png -frames:v 12 \\
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \\
            output/character-animation-proof.mp4
          test -s output/character-animation-proof.mp4
          test -s output/character-animation-proof.json
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json output/character-animation-proof.mp4
      - name: Reject static or background-only character footage
        run: python scripts/subject_motion_qa.py output/character-animation-proof.mp4 --report output/character-animation-proof.motion-qa.json
      - name: Upload actual animated character proof and QA
        uses: actions/upload-artifact@v4
        with:
          name: character-glb-animation-proof
          path: |
            output/character-animation-proof.mp4
            output/character-animation-proof.json
            output/character-animation-proof.motion-qa.json
            output/animation-review/**
          if-no-files-found: error
          retention-days: 7
