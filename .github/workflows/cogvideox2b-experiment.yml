name: Digital Edge Lab — Free GPU text-to-video experiment

on:
  workflow_dispatch:
    inputs:
      confirm_free_gpu:
        description: "Use my available free Kaggle GPU quota for a single test clip"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: digital-edge-lab-t2v-experiment
  cancel-in-progress: false

jobs:
  cogvideox2b-test:
    if: inputs.confirm_free_gpu
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KERNEL_SLUG: digital-edge-lab-cogvideox2b-experiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI and validate free GPU credentials
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          test -n "${KAGGLE_USERNAME:-}" || { echo "::error::KAGGLE_USERNAME secret is missing"; exit 1; }
          test -n "${KAGGLE_KEY:-}" || { echo "::error::KAGGLE_KEY secret is missing"; exit 1; }
          mkdir -p "$HOME/.kaggle" "$RUNNER_TEMP/t2v-kernel"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path.home().joinpath(".kaggle","kaggle.json").write_text(json.dumps({"username":os.environ["KAGGLE_USERNAME"],"key":os.environ["KAGGLE_KEY"]}))
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"
          cp kaggle/video-engine-experiment/cogvideox2b_test.py "$RUNNER_TEMP/t2v-kernel/"
          cat > "$RUNNER_TEMP/t2v-kernel/kernel-metadata.json" <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "Digital Edge Lab CogVideoX 2B T2V Experiment",
            "code_file": "cogvideox2b_test.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "true",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
      - name: Push experiment to Kaggle free T4
        run: |
          set -euo pipefail
          kaggle kernels push -p "$RUNNER_TEMP/t2v-kernel" --accelerator NvidiaTeslaT4 --timeout 10800
      - name: Wait for generation
        timeout-minutes: 185
        run: |
          set -euo pipefail
          completed=0
          for attempt in $(seq 1 180); do
            status="$(kaggle kernels status "$KAGGLE_USERNAME/$KERNEL_SLUG" 2>&1 || true)"
            echo "Kaggle status $attempt/180: $status"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$lower" | grep -Eq '(^|[^a-z])(complete|success)([^a-z]|$)'; then completed=1; break; fi
            if printf '%s' "$lower" | grep -Eq 'error|failed|cancelled|canceled'; then
              kaggle kernels logs "$KAGGLE_USERNAME/$KERNEL_SLUG" || true
              exit 1
            fi
            sleep 60
          done
          if [ "$completed" -ne 1 ]; then
            kaggle kernels logs "$KAGGLE_USERNAME/$KERNEL_SLUG" || true
            echo "::error::Experiment timed out waiting for Kaggle"
            exit 1
          fi
      - name: Retrieve generated clip and visual QA frames
        run: |
          set -euo pipefail
          mkdir -p output/cogvideox2b-experiment
          kaggle kernels output "$KAGGLE_USERNAME/$KERNEL_SLUG" -p output/cogvideox2b-experiment --force
          test -s output/cogvideox2b-experiment/cogvideox2b_portrait.mp4
          test -s output/cogvideox2b-experiment/experiment_metadata.json
          test -s output/cogvideox2b-experiment/frame_00.jpg
          test -s output/cogvideox2b-experiment/frame_02.jpg
          test -s output/cogvideox2b-experiment/frame_05.jpg
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,avg_frame_rate -of json output/cogvideox2b-experiment/cogvideox2b_portrait.mp4
      - name: Upload experiment for manual artifact inspection
        uses: actions/upload-artifact@v4
        with:
          name: cogvideox2b-real-t2v-experiment
          path: output/cogvideox2b-experiment/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve generation logs on failure
        if: failure()
        run: kaggle kernels logs "$KAGGLE_USERNAME/$KERNEL_SLUG" || true
