name: Digital Edge Lab — Zero-cost cinematic pilot
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic for the pilot; leave blank for the built-in AI-memory episode"
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: digital-edge-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-verify:
    name: Render real animated MP4 with narration and audio
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EPISODE_TOPIC: ${{ inputs.topic }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install free system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python renderer dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10.0.0"
      - name: Compile and smoke-check engine
        run: python -m py_compile scripts/free_video_engine.py
      - name: Generate actual 30-second animated vertical video
        run: python scripts/free_video_engine.py
      - name: Upload MP4 and QA report
        uses: actions/upload-artifact@v4
        with:
          name: digital-edge-lab-free-pilot-${{ github.run_number }}
          path: output/video/*
          if-no-files-found: error
          retention-days: 14
